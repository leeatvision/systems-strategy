# Builds the app and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# The brand files (name, logo, colours, server address) live in a separate private repo:
# BRAND_REPO names it, BRAND_PATH is this app's folder in it, and the BRAND_TOKEN secret
# (read-only access to that repo) reads it. Only that folder is fetched.
# Third-party steps are pinned to exact commits so a changed tag can't alter the build.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.BRAND_REPO }}
          token: ${{ secrets.BRAND_TOKEN }}
          path: .brand-repo
          sparse-checkout: ${{ vars.BRAND_PATH }}
          persist-credentials: false
      - run: test -n "$BRAND_PATH" && mv ".brand-repo/$BRAND_PATH" brand && rm -rf .brand-repo
        env:
          BRAND_PATH: ${{ vars.BRAND_PATH }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          REQUIRE_BRAND: "1"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
